# Supabase sætter gratis projekter på pause efter en uge uden aktivitet.
# Denne lille opgave kalder databasen én gang om dagen, så det aldrig sker.
# Bruger projektets offentlige adresse og publishable key (de ligger også i selve appen, så de er ikke hemmelige).
name: Hold databasen vågen

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kald Supabase
        run: |
          curl --fail --silent --show-error \
            "https://ebaadbcesarxqjqhcrem.supabase.co/rest/v1/settings?select=id" \
            -H "apikey: sb_publishable_FgMRhFNB_ybKnS3pAdjdog__UzKL4fM" > /dev/null
          echo "Databasen svarede"
