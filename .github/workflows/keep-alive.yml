# Supabase sætter gratis projekter på pause efter en uge uden aktivitet.
# Denne lille opgave kalder databasen én gang om dagen, så det aldrig sker.
# Kræver to secrets i GitHub: SUPABASE_URL og SUPABASE_KEY (se docs/OPSAETNING.md, trin 9).
name: Hold databasen vågen

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kald Supabase
        run: |
          curl --fail --silent --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/settings?select=id" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" > /dev/null
          echo "Databasen svarede"
